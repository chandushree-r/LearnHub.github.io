<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - LearnHub</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #f0f8ff; /* Light blue background */
        }

        .navbar {
            background-color: #f0f8ff; /* Light blue navbar */
        }

        .navbar-nav .nav-item .nav-link {
            color: maroon;
            background-color: #f0f8ff;
            padding: 10px;
            margin: 0 5px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .navbar-nav .nav-item .nav-link:hover {
            background-color: #005f5f; /* Darker shade on hover */
        }

        .contact-card {
            background-color: #e6f7ff; /* Slightly darker blue shade for the card */
            border: 1px solid #cce7ff; /* Subtle border */
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }

        .contact-title {
            color: #007bff; /* Blue text for title */
        }

        .contact-info {
            color: #0056b3; /* Darker blue for info */
        }

        footer {
            background-color: powderblue; /* Light blue footer */
            text-align: center;
            padding: 20px;
            position: absolute;
            bottom: 0;
            width: 100%;
        }

        footer p {
            margin: 0;
            padding: 0;
        }

        /* Ensures content fills available space and pushes footer to the bottom */
        .content-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-content {
            flex-grow: 1;
        }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-light">
            <a class="navbar-brand" href="#">LearnHub</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="signup.html">Sign Up</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="container my-5 main-content">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="contact-card">
                        <h2 class="text-center contact-title">Contact Us</h2>
                        <p class="text-center text-muted">We'd love to hear from you!</p>
                        <div class="mt-4">
                            <p class="contact-info"><strong>Website Name:</strong> LearnHub</p>
                            <p class="contact-info"><strong>Instagram:</strong> <a href="https://instagram.com/learnhub" target="_blank">@learnhub</a></p>
                            <p class="contact-info"><strong>Email:</strong> <a href="mailto:support@learnhub.com">support@learnhub.com</a></p>
                            <p class="contact-info"><strong>Phone:</strong> +123 456 7890</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 LearnHub. All rights reserved. Author: Chandushree R.</p>
    </footer>

    <!-- Bootstrap Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
